name: Recordatorio Mantenimiento Diario

# El disparo automático diario (cron) se desactivó: ahora este envío lo maneja
# un cron job de Supabase (pg_cron) que llama a la misma función cada hora y
# respeta el "Horario de envío" configurado dentro del sistema. Tener los dos
# mecanismos activos al mismo tiempo era redundante y este (fijo a las 8am,
# sin poder ajustarse desde la pantalla) ya no hacía falta.
# Se deja "workflow_dispatch" para poder correrlo manualmente desde GitHub si
# se necesita probar o forzar un envío.
on:
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar Edge Function de recordatorios
        run: |
          echo "🔧 Iniciando envío de recordatorios de mantenimiento..."

          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://wwghvummkxekrenfgzsd.supabase.co/functions/v1/send-maintenance-reminders")

          echo "HTTP Status: $response"
          echo "Response body:"
          cat /tmp/response.json

          if [ "$response" != "200" ]; then
            echo "❌ Error: La función retornó status $response"
            exit 1
          fi

          echo "✅ Recordatorios enviados correctamente"
